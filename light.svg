<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8">
        <animate attributeName="stop-color" values="#f0f4f8;#e8edf5;#f0f4f8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e8edf5">
        <animate attributeName="stop-color" values="#e8edf5;#f0f4f8;#e8edf5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="borderGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#b44fff;#ffd700;#00f5ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b44fff">
        <animate attributeName="stop-color" values="#b44fff;#ffd700;#00f5ff;#b44fff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#b44fff"/>
      <stop offset="100%" stop-color="#ffd700"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glowL"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <pattern id="scanlinesL" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="transparent"/>
      <rect y="2" width="100%" height="2" fill="rgba(0,0,0,0.03)"/>
    </pattern>
