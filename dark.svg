    <!-- ARQON badge -->
    <rect x="430" y="512" width="340" height="28" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="0.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.2s" fill="freeze"/>
    </rect>
    <text x="440" y="531" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#00ff88" opacity="0">
