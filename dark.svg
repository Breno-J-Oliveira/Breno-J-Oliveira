<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816;#0d0d0d;#0B1120;#050816" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d0d0d">
        <animate attributeName="stop-color" values="#0d0d0d;#0B1120;#050816;#0d0d0d" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0B1120">
        <animate attributeName="stop-color" values="#0B1120;#050816;#0d0d0d;#0B1120" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#b44fff;#ffd700;#00f5ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b44fff">
        <animate attributeName="stop-color" values="#b44fff;#ffd700;#00f5ff;#b44fff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Text gradient for ASCII art -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#b44fff"/>
      <stop offset="100%" stop-color="#ffd700"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Scanlines pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="transparent"/>
      <rect y="2" width="100%" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>

    <!-- Clip paths for text reveal animation -->
    <clipPath id="reveal1"><rect x="420" y="88" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal2"><rect x="420" y="115" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal3"><rect x="420" y="142" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal4"><rect x="420" y="169" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal5"><rect x="420" y="196" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal6"><rect x="420" y="223" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal7"><rect x="420" y="250" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal8"><rect x="420" y="277" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="2.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal9"><rect x="420" y="304" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal10"><rect x="420" y="331" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal11"><rect x="420" y="358" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal12"><rect x="420" y="385" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="3.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal13"><rect x="420" y="412" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="reveal14"><rect x="420" y="439" width="740" height="20"><animate attributeName="width" from="0" to="740" dur="0.3s" begin="3.4s" fill="freeze"/></rect></clipPath>

    <!-- Reveal mask for entire SVG -->
    <mask id="svgReveal">
      <rect width="1180" height="610" fill="black">
        <animate attributeName="height" from="0" to="610" dur="2.5s" fill="freeze"/>
      </rect>
      <rect y="0" width="1180" height="610" fill="white">
        <animate attributeName="y" from="-610" to="0" dur="2.5s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <!-- Main SVG with reveal mask -->
  <g mask="url(#svgReveal)">
    <!-- Background -->
    <rect width="1180" height="610" fill="url(#bgGrad)" rx="12"/>

    <!-- Scanlines overlay -->
    <rect width="1180" height="610" fill="url(#scanlines)" opacity="0.4" rx="12"/>

    <!-- Outer border -->
    <rect x="1" y="1" width="1178" height="608" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- ==================== TITLEBAR ==================== -->
    <rect x="0" y="0" width="1180" height="38" rx="12" fill="#1a1a2e"/>
    <rect x="0" y="20" width="1180" height="18" fill="#1a1a2e"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="19" r="6" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="19" r="6" fill="#F59E0B">
      <animate attributeName="opacity" values="0.4;1;0.6;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="19" r="6" fill="#10B981">
      <animate attributeName="opacity" values="0.6;1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Titlebar text -->
    <text x="590" y="24" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#a0a0b0">breno@galaxy ~ % ./profile.sh --live</text>

    <!-- ONLINE indicator -->
    <circle cx="1148" cy="19" r="4" fill="#00ff88">
      <animate attributeName="r" values="4;5.5;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1130" y="24" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#00ff88" filter="url(#glow)">ONLINE</text>

    <!-- ==================== LEFT PANEL — ASCII ART ==================== -->
    <!-- Panel border -->
    <rect x="15" y="50" width="390" height="545" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.3"/>

    <!-- ASCII Art BRENO -->
    <text x="205" y="120" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>
██████╗ ██████╗ ███████╗███╗   ██╗ ██████╗
    </text>
    <text x="205" y="136" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze"/>
██╔══██╗██╔══██╗██╔════╝████╗  ██║██╔═══██╗
    </text>
    <text x="205" y="152" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.7s" fill="freeze"/>
██████╔╝██████╔╝█████╗  ██╔██╗ ██║██║   ██║
    </text>
    <text x="205" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
██╔══██╗██╔══██╗██╔══╝  ██║╚██╗██║██║   ██║
    </text>
    <text x="205" y="184" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>
██████╔╝██║  ██║███████╗██║ ╚████║╚██████╔╝
    </text>
    <text x="205" y="200" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.3s" fill="freeze"/>
╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝  ╚═══╝ ╚═════╝
    </text>

    <!-- Decorative line -->
    <line x1="60" y1="225" x2="350" y2="225" stroke="url(#borderGrad)" stroke-width="1" opacity="0.4"/>

    <!-- ASCII Subtitle -->
    <text x="205" y="255" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#00f5ff" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/>
┌─────────────────────────────┐
    </text>
    <text x="205" y="273" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.0s" fill="freeze"/>
│  Full Stack Developer       │
    </text>
    <text x="205" y="291" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#a0a0b0" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.2s" fill="freeze"/>
│  Backend · APIs · Arch      │
    </text>
    <text x="205" y="309" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#00f5ff" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.4s" fill="freeze"/>
└─────────────────────────────┘
    </text>

    <!-- Stack icons as text -->
    <text x="205" y="355" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#b44fff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.6s" fill="freeze"/>
TS · PHP · Python · C/C++
    </text>
    <text x="205" y="375" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.8s" fill="freeze"/>
Next.js · NestJS · Docker
    </text>
    <text x="205" y="395" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#00ff88" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.0s" fill="freeze"/>
PostgreSQL · Redis · Prisma
    </text>

    <!-- Terminal prompt decoration -->
    <text x="40" y="450" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#505060" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="3.5s" fill="freeze"/>
$ echo "Do silício ao container Docker"
    </text>
    <text x="40" y="468" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#00f5ff" opacity="0">
      <animate attributeName="opacity" from="0" to="0.8" dur="1s" begin="3.7s" fill="freeze"/>
Do silício ao container Docker
    </text>

    <!-- OS/Editor badges at bottom -->
    <text x="205" y="520" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="9" fill="#505060" opacity="0">
      <animate attributeName="opacity" from="0" to="0.5" dur="1s" begin="4s" fill="freeze"/>
── arch linux · vscode · vim ──
    </text>

    <!-- ==================== RIGHT PANEL — NEOFETCH ==================== -->
    <!-- Panel border -->
    <rect x="415" y="50" width="750" height="545" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.3"/>

    <!-- Neofetch header -->
    <text x="430" y="78" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#505060" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="0.5s" begin="0.6s" fill="freeze"/>
      ╭────────────────── system info ──────────────────╮
    </text>

    <!-- Neofetch lines with reveal animation -->
    <g clip-path="url(#reveal1)">
      <text x="430" y="102" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">name</tspan>
        <tspan fill="#505060">      → </tspan>
        <tspan fill="#ffffff">Breno J. Oliveira</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal2)">
      <text x="430" y="129" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">role</tspan>
        <tspan fill="#505060">      → </tspan>
        <tspan fill="#ffffff">Full Stack Developer</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal3)">
      <text x="430" y="156" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">focus</tspan>
        <tspan fill="#505060">     → </tspan>
        <tspan fill="#b44fff">Backend · APIs · Architecture</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal4)">
      <text x="430" y="183" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">language</tspan>
        <tspan fill="#505060">  → </tspan>
        <tspan fill="#ffd700">TypeScript · PHP · Python</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal5)">
      <text x="430" y="210" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">frontend</tspan>
        <tspan fill="#505060">  → </tspan>
        <tspan fill="#ffffff">Next.js · React · Tailwind</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal6)">
      <text x="430" y="237" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">backend</tspan>
        <tspan fill="#505060">   → </tspan>
        <tspan fill="#ffffff">NestJS · Node.js · Express</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal7)">
      <text x="430" y="264" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">database</tspan>
        <tspan fill="#505060">  → </tspan>
        <tspan fill="#ffffff">PostgreSQL · Redis · Prisma</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal8)">
      <text x="430" y="291" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">devops</tspan>
        <tspan fill="#505060">    → </tspan>
        <tspan fill="#ffffff">Docker · GitHub Actions · Vercel</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal9)">
      <text x="430" y="318" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">os</tspan>
        <tspan fill="#505060">        → </tspan>
        <tspan fill="#b44fff">Arch Linux / Ubuntu Server</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal10)">
      <text x="430" y="345" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">editor</tspan>
        <tspan fill="#505060">    → </tspan>
        <tspan fill="#ffffff">VS Code + vim</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal11)">
      <text x="430" y="372" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">location</tspan>
        <tspan fill="#505060">  → </tspan>
        <tspan fill="#ffd700">São Paulo, Brasil 🇧🇷</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal12)">
      <text x="430" y="399" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">status</tspan>
        <tspan fill="#505060">    → </tspan>
        <tspan fill="#00ff88" filter="url(#glow)">● OPEN TO WORK</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal13)">
      <text x="430" y="426" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">linkedin</tspan>
        <tspan fill="#505060">  → </tspan>
        <tspan fill="#00f5ff">in/brenojoliveira</tspan>
      </text>
    </g>

    <g clip-path="url(#reveal14)">
      <text x="430" y="453" font-family="'Courier New', Consolas, monospace" font-size="13">
        <tspan fill="#00f5ff" filter="url(#glow)">github</tspan>
        <tspan fill="#505060">    → </tspan>
        <tspan fill="#b44fff">Breno-J-Oliveira</tspan>
        <tspan fill="#00f5ff">█</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Separator line -->
    <line x1="430" y1="475" x2="1140" y2="475" stroke="url(#borderGrad)" stroke-width="1" opacity="0.2"/>

    <!-- Project badges -->
    <text x="430" y="500" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#505060" opacity="0">
